name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: |
          dotnet restore BundleRecompressCli.csproj
          dotnet restore Bootstrap/Bootstrap.csproj

      - name: Build worker
        run: dotnet build BundleRecompressCli.csproj --configuration Release --no-restore

      - name: Build bootstrap
        run: dotnet build Bootstrap/Bootstrap.csproj --configuration Release --no-restore

      - name: Verify pinned AssetsTools.NET binary (build-time pin)
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'bin/Release/net48/AssetsTools.NET.dll'
          if (-not (Test-Path $dll)) {
            throw "AssetsTools.NET.dll was not copied to the build output: $dll"
          }
          $expected = '8d3cf02a877b0fa0363c7aa5aede18b8c1023519632f5e7eac19ad084c743b34'
          $actual = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Pinned AssetsTools.NET.dll hash mismatch. Expected $expected, got $actual"
          }

      - name: Smoke test worker help
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'bin/Release/net48/BundleRecompressCli.Worker.exe'
          if (-not (Test-Path $exe)) {
            throw "Worker executable was not produced: $exe"
          }
          & $exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "Worker help command failed with exit code $LASTEXITCODE"
          }

      - name: Verify ps1 syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'release/bin/batch_lzma_cli_pwsh.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw 'PowerShell syntax errors' }

      - name: Package artifact
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/package.ps1') `
            -WorkerOutDir (Join-Path $env:GITHUB_WORKSPACE 'bin/Release/net48') `
            -BootstrapOutDir (Join-Path $env:GITHUB_WORKSPACE 'Bootstrap/bin/Release/net48') `
            -TemplateDir (Join-Path $env:GITHUB_WORKSPACE 'release') `
            -StagingDir (Join-Path $env:GITHUB_WORKSPACE 'artifact/staging') `
            -ZipPath (Join-Path $env:GITHUB_WORKSPACE 'BundleRecompressCli-win-x64.zip')

      - name: Smoke test packaged CLI
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE 'artifact/staging'
          $exe = Join-Path $staging 'bin/BundleRecompressCli.exe'
          # --no-update: в CI не ходим в сеть; проверяем запуск Bootstrap -> Worker
          & $exe --no-update --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI help failed with exit code $LASTEXITCODE" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BundleRecompressCli-win-x64
          path: BundleRecompressCli-win-x64.zip
