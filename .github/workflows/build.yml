name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore BundleRecompressCli.csproj

      - name: Build
        run: dotnet build BundleRecompressCli.csproj --configuration Release --no-restore

      - name: Verify pinned AssetsTools.NET binary
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'bin/Release/net48/AssetsTools.NET.dll'
          if (-not (Test-Path $dll)) {
            throw "AssetsTools.NET.dll was not copied to the build output: $dll"
          }
          $expected = '6b03d589163623b67620fbbc6f425dcb47f856584bd3ab1a34c896b2666372e4'
          $actual = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Pinned AssetsTools.NET.dll hash mismatch. Expected $expected, got $actual"
          }

      - name: Smoke test help
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'bin/Release/net48/BundleRecompressCli.exe'
          if (-not (Test-Path $exe)) {
            throw "Executable was not produced: $exe"
          }
          & $exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "Help command failed with exit code $LASTEXITCODE"
          }

      - name: Package artifact
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Copy-Item 'bin/Release/net48/BundleRecompressCli.exe' $output
          Copy-Item 'bin/Release/net48/AssetsTools.NET.dll' $output
          Copy-Item 'logo.ico' $output
          Compress-Archive -Path "$output/*" -DestinationPath 'BundleRecompressCli-win-x64.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BundleRecompressCli-win-x64
          path: BundleRecompressCli-win-x64.zip
